name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libssl-dev clang-18 libstdc++-14-dev ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja boost openssl@3 ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        env:
          CXX: ${{ runner.os == 'Linux' && 'clang++-18' || 'clang++' }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'Linux' && '-DREALURL_WITH_IO_URING=ON' || '-DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
